# Nombre de proyecto propio: evita mezclar estos contenedores con los de
# otros proyectos cuya carpeta tambien se llame "entorno".
name: tc-automatalab

# Tres servicios, uno por version de Python, construidos con el mismo
# Dockerfile. Los comandos se ejecutan desde la carpeta entorno/.
services:

  py311:
    build:
      context: ..
      dockerfile: entorno/Dockerfile
      args:
        PYTHON_VERSION: "3.11"
    image: tc_automatalab:py311
    container_name: tc_py311
    volumes:
      - ..:/app
    command: pytest -q

  py312:
    build:
      context: ..
      dockerfile: entorno/Dockerfile
      args:
        PYTHON_VERSION: "3.12"
    image: tc_automatalab:py312
    container_name: tc_py312
    ports:
      - "8550:8550"   # equipo : contenedor
    volumes:
      - ..:/app

  py313:
    build:
      context: ..
      dockerfile: entorno/Dockerfile
      args:
        PYTHON_VERSION: "3.13"
    image: tc_automatalab:py313
    container_name: tc_py313
    volumes:
      - ..:/app
    command: pytest -q
