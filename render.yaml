# Despliegue en Render (Blueprint). En Render: New > Blueprint, elegir este
# repositorio y escribir el valor de IA_API_KEY cuando lo pida.
services:
  - type: web
    name: automatalab
    runtime: docker
    plan: free
    # Se reutiliza el Dockerfile del entorno (Python 3.12, el del curso).
    dockerfilePath: ./entorno/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Clave gratuita de Groq (console.groq.com). Sin ella la aplicación
      # funciona, pero sin IA.
      - key: IA_API_KEY
        sync: false
      # Servicio y modelo del asistente (Groq, plan gratuito).
      - key: IA_URL
        value: https://api.groq.com/openai/v1
      - key: IA_MODELO
        value: openai/gpt-oss-120b
      # Consultas a la IA permitidas por cada sesión del navegador.
      - key: IA_LIMITE_SESION
        value: "40"
