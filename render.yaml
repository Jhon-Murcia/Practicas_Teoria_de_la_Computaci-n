# Despliegue en Render (Blueprint). En Render: New > Blueprint, elegir este
# repositorio y escribir el valor de ANTHROPIC_API_KEY cuando lo pida.
services:
  - type: web
    name: automatalab
    runtime: docker
    plan: free
    # Se reutiliza el Dockerfile del entorno (Python 3.12, el del curso).
    dockerfilePath: ./entorno/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Clave de la API de Claude. Sin ella la aplicación funciona, pero sin IA.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Modelo del asistente. claude-haiku-5-5 es mucho más barato.
      - key: IA_MODELO
        value: claude-opus-5-5
      # Consultas a la IA permitidas por cada sesión del navegador.
      - key: IA_LIMITE_SESION
        value: "40"
